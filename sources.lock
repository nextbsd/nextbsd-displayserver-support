# sources.lock: every upstream source nextbsd-displayserver-support builds, pinned.
#
# One line per component:  <name> <version> <sha256> <url>
# <name> matches build_<name> in build-displayserver-support.sh (hyphens as
# underscores) and patches/<name>/. build-displayserver-support.sh downloads
# <url>, refuses it unless its SHA-256 is <sha256>, and unpacks it. Only
# upstream release tarballs (or tag archives) are listed: no FreeBSD packages or
# ports distfiles, no xsrc or xenocara. Bumping a version is a deliberate change
# to this file.
#
# These are the pins nextbsd-xlibs and nextbsd-xlibre built before the move
# (E25, "What moves"): keep them identical to those repos' until each has
# dropped its copy. linux-input-shim is NextBSD's own (no upstream source) and
# is not listed.

